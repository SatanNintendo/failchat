name: Manual Windows x64 build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Install project JDK
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $jdkVersion = '11.0.22+12'
          $jdkArchiveName = 'bellsoft-jdk11.0.22+12-windows-amd64-full'
          $jdkArchive = Join-Path $env:RUNNER_TEMP "$jdkArchiveName.zip"

          $jdkUrl = "https://download.bell-sw.com/java/$jdkVersion/$jdkArchiveName.zip"

          $jdkBase = Join-Path $env:GITHUB_WORKSPACE 'jdk'
          $expectedJdkRoot = Join-Path $jdkBase $jdkArchiveName

          Write-Host "Downloading Liberica JDK:"
          Write-Host $jdkUrl

          New-Item -ItemType Directory -Force -Path $jdkBase | Out-Null

          Invoke-WebRequest `
            -Uri $jdkUrl `
            -OutFile $jdkArchive `
            -UseBasicParsing

          Write-Host "Extracting JDK archive..."

          Expand-Archive `
            -Path $jdkArchive `
            -DestinationPath $jdkBase `
            -Force

          Write-Host "Searching for JDK directory containing jmods..."

          $jmodsDirectory = Get-ChildItem `
            -Path $jdkBase `
            -Directory `
            -Filter 'jmods' `
            -Recurse `
            -ErrorAction Stop |
            Select-Object -First 1

          if (-not $jmodsDirectory) {
            Write-Host "Contents of JDK directory:"
            Get-ChildItem -Path $jdkBase -Force -Recurse |
              Select-Object FullName, Length |
              Format-Table -AutoSize

            throw "Could not find a jmods directory inside the downloaded Liberica JDK."
          }

          $jdkRoot = $jmodsDirectory.Parent.FullName

          Write-Host "Detected JDK root:"
          Write-Host $jdkRoot

          Write-Host "Detected jmods:"
          Write-Host $jmodsDirectory.FullName

          if (-not (Test-Path (Join-Path $jdkRoot 'bin\java.exe'))) {
            throw "Detected JDK directory does not contain bin\java.exe: $jdkRoot"
          }

          if (-not (Test-Path (Join-Path $jdkRoot 'bin\jlink.exe'))) {
            throw "Detected JDK directory does not contain bin\jlink.exe: $jdkRoot"
          }

          if ($jdkRoot.TrimEnd('\') -ne $expectedJdkRoot.TrimEnd('\')) {
            Write-Host "Creating compatibility junction for the path expected by pom.xml..."

            if (Test-Path $expectedJdkRoot) {
              Remove-Item -LiteralPath $expectedJdkRoot -Recurse -Force
            }

            New-Item `
              -ItemType Junction `
              -Path $expectedJdkRoot `
              -Target $jdkRoot | Out-Null
          }

          if (-not (Test-Path (Join-Path $expectedJdkRoot 'jmods'))) {
            throw "Compatibility JDK path was not created correctly: $expectedJdkRoot"
          }

          "JAVA_HOME=$jdkRoot" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          $jdkRootBin = Join-Path $jdkRoot 'bin'

          $jdkRootBin |
            Out-File `
              -FilePath $env:GITHUB_PATH `
              -Encoding utf8 `
              -Append

          Write-Host "JAVA_HOME set to:"
          Write-Host $jdkRoot

      - name: Verify build tools
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          java -version
          jlink --version
          mvn -version

      - name: Prepare private configuration for packaging
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $privateConfig = 'src/main/resources/config/private.properties'

          if (-not (Test-Path $privateConfig)) {
            @(
              'twitch.bot-name='
              'twitch.bot-password='
              'twitch.client-id='
              'twitch.client-secret='
            ) | Set-Content -Path $privateConfig -Encoding utf8
          }

      - name: Build distribution
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          mvn --batch-mode --no-transfer-progress package -DskipTests

      - name: Verify package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $packages = @(
            Get-ChildItem -Path 'target' -Filter 'failchat-v*.zip' -File
          )

          if ($packages.Count -ne 1) {
            throw "Expected exactly one failchat distribution ZIP, found $($packages.Count)"
          }

          Write-Host "Built package: $($packages[0].FullName)"
          Write-Host "Size: $($packages[0].Length) bytes"

      - name: Upload distribution
        uses: actions/upload-artifact@v7
        with:
          name: failchat-windows-x64
          path: target/failchat-v*.zip
          if-no-files-found: error
          retention-days: 14
