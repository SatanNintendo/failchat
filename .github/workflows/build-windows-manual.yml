name: Windows Manual Build

on:
workflow_dispatch:

permissions:
contents: read

jobs:
build-windows:
name: Build Windows
runs-on: windows-latest

```
env:
  JAVA_HOME: ${{ github.workspace }}\jdk\jdk-11.0.22-full

steps:
  - name: Checkout source
    uses: actions/checkout@v4

  - name: Verify bundled Java
    shell: powershell
    run: |
      Write-Host "JAVA_HOME = $env:JAVA_HOME"
      & "$env:JAVA_HOME\bin\java.exe" -version

  - name: Build with Maven
    shell: powershell
    run: |
      mvn.cmd --batch-mode --no-transfer-progress package '-Dmaven.test.skip=true'

  - name: Upload build artifacts
    uses: actions/upload-artifact@v4
    with:
      name: failchat-windows
      path: |
        target/*.jar
        target/*.zip
      if-no-files-found: warn
      retention-days: 7
```
