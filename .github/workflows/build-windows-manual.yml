name: Manual Windows x64 build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Install Liberica JDK 11
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $jdkVersion = '11.0.22+12'
          $jdkName = 'bellsoft-jdk11.0.22+12-windows-amd64-full'
          $jdkArchive = Join-Path $env:RUNNER_TEMP "$jdkName.zip"
          $jdkUrl = "https://download.bell-sw.com/java/$jdkVersion/$jdkName.zip"

          $jdkBase = Join-Path $env:GITHUB_WORKSPACE 'jdk'
          $expectedJdkRoot = Join-Path $jdkBase $jdkName

          Write-Host "Downloading:"
          Write-Host $jdkUrl

          New-Item -ItemType Directory -Force -Path $jdkBase | Out-Null

          Invoke-WebRequest `
            -Uri $jdkUrl `
            -OutFile $jdkArchive `
            -UseBasicParsing

          Write-Host "Extracting JDK..."

          Expand-Archive `
            -Path $jdkArchive `
            -DestinationPath $jdkBase `
            -Force

          Write-Host "Finding JDK root..."

          $jmods = Get-ChildItem `
            -Path $jdkBase `
            -Directory `
            -Filter 'jmods' `
            -Recurse `
            -ErrorAction Stop |
            Select-Object -First 1

          if (-not $jmods) {
            Get-ChildItem -Path $jdkBase -Force -Recurse |
              Select-Object FullName

            throw "Could not find JDK jmods directory."
          }

          $jdkRoot = $jmods.Parent.FullName

          Write-Host "Detected JDK:"
          Write-Host $jdkRoot

          if (-not (Test-Path (Join-Path $jdkRoot 'bin\java.exe'))) {
            throw "java.exe was not found in: $jdkRoot"
          }

          if (-not (Test-Path (Join-Path $jdkRoot 'bin\jlink.exe'))) {
            throw "jlink.exe was not found in: $jdkRoot"
          }

          if ($jdkRoot.TrimEnd('\') -ne $expectedJdkRoot.TrimEnd('\')) {
            Write-Host "Creating compatibility junction..."

            if (Test-Path $expectedJdkRoot) {
              Remove-Item -LiteralPath $expectedJdkRoot -Recurse -Force
            }

            New-Item `
              -ItemType Junction `
              -Path $expectedJdkRoot `
              -Target $jdkRoot | Out-Null
          }

          if (-not (Test-Path (Join-Path $expectedJdkRoot 'jmods'))) {
            throw "Expected JDK path was not created: $expectedJdkRoot"
          }

          "JAVA_HOME=$jdkRoot" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          (Join-Path $jdkRoot 'bin') |
            Out-File `
              -FilePath $env:GITHUB_PATH `
              -Encoding utf8 `
              -Append

      - name: Verify Java and Maven
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          java -version
          jlink --version
          mvn -version

      - name: Prepare private configuration
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $privateConfig = 'src/main/resources/config/private.properties'

          if (-not (Test-Path $privateConfig)) {
            @(
              'twitch.bot-name='
              'twitch.bot-password='
              'twitch.client-id='
              'twitch.client-secret='
            ) | Set-Content `
              -Path $privateConfig `
              -Encoding utf8
          }

      - name: Fix Kotlin source compatibility
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $mainFile = 'src/main/kotlin/failchat/FailchatMain.kt'
          $ttsFile = 'src/main/kotlin/failchat/tts/StreamElementsTtsClient.kt'

          if (-not (Test-Path $mainFile)) {
            throw "File not found: $mainFile"
          }

          if (-not (Test-Path $ttsFile)) {
            throw "File not found: $ttsFile"
          }

          # Fix missing UiLanguage import.
          $text = Get-Content -Path $mainFile -Raw

          if ($text -notmatch '(?m)^import failchat\.gui\.UiLanguage\s*$') {
            $marker = 'import failchat.gui.PortBindAlert'

            if ($text -notmatch [regex]::Escape($marker)) {
              throw "Could not find import location in $mainFile"
            }

            $text = $text.Replace(
              $marker,
              "$marker`r`nimport failchat.gui.UiLanguage"
            )
          }

          Set-Content `
            -Path $mainFile `
            -Value $text `
            -Encoding utf8 `
            -NoNewline

          # Fix OkHttp 4 API changes.
          $text = Get-Content -Path $ttsFile -Raw

          if ($text -notmatch '(?m)^import okhttp3\.HttpUrl\.Companion\.toHttpUrlOrNull\s*$') {
            $marker = 'import okhttp3.HttpUrl'

            if ($text -match [regex]::Escape($marker)) {
              $text = $text.Replace(
                $marker,
                'import okhttp3.HttpUrl.Companion.toHttpUrlOrNull'
              )
            }
            else {
              $marker = 'import com.fasterxml.jackson.databind.ObjectMapper'

              if ($text -notmatch [regex]::Escape($marker)) {
                throw "Could not find import location in $ttsFile"
              }

              $text = $text.Replace(
                $marker,
                "$marker`r`nimport okhttp3.HttpUrl.Companion.toHttpUrlOrNull"
              )
            }
          }

          $text = $text.Replace(
            'HttpUrl.parse(apiUrl)',
            'apiUrl.toHttpUrlOrNull()'
          )

          $text = $text.Replace(
            'response.code()',
            'response.code'
          )

          $text = $text.Replace(
            'response.body()',
            'response.body'
          )

          Set-Content `
            -Path $ttsFile `
            -Value $text `
            -Encoding utf8 `
            -NoNewline

      - name: Build
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          mvn --batch-mode --no-transfer-progress package "-Dmaven.test.skip=true"

      - name: Verify package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $packages = @(
            Get-ChildItem `
              -Path 'target' `
              -Filter 'failchat-v*.zip' `
              -File
          )

          if ($packages.Count -ne 1) {
            throw "Expected exactly one failchat ZIP, found $($packages.Count)"
          }

          $package = $packages[0]
          Write-Host "Package:"
          Write-Host $package.FullName

          $verifyDir = Join-Path $env:RUNNER_TEMP 'failchat-package-check'
          if (Test-Path $verifyDir) {
            Remove-Item -LiteralPath $verifyDir -Recurse -Force
          }

          Expand-Archive -Path $package.FullName -DestinationPath $verifyDir -Force

          $root = Get-ChildItem -Path $verifyDir -Directory | Select-Object -First 1
          if (-not $root) {
            throw 'Could not find the Failchat distribution directory inside the ZIP.'
          }

          $javaw = Join-Path $root.FullName 'runtime\bin\javaw.exe'
          $java = Join-Path $root.FullName 'runtime\bin\java.exe'
          $agent = Join-Path $root.FullName 'java-agents\transparent-webview-patch.jar'
          $launcher = Join-Path $root.FullName 'failchat.bat'
          $debugLauncher = Join-Path $root.FullName 'failchat-debug.bat'

          foreach ($requiredFile in @($javaw, $java, $agent, $launcher, $debugLauncher)) {
            if (-not (Test-Path $requiredFile)) {
              throw "Required packaged file is missing: $requiredFile"
            }
          }

          $jar = Get-ChildItem -Path $root.FullName -Filter 'failchat-*.jar' -File | Select-Object -First 1
          if (-not $jar) {
            throw 'Failchat JAR was not found in the package.'
          }

          $jarEntries = & jar tf $jar.FullName
          if (-not ($jarEntries -contains 'i18n/messages.properties')) {
            throw 'i18n/messages.properties is missing from the Failchat JAR.'
          }
          if (-not ($jarEntries -contains 'i18n/messages_ru.properties')) {
            throw 'i18n/messages_ru.properties is missing from the Failchat JAR.'
          }

          Write-Host 'Package contents verified:'
          Write-Host "  $javaw"
          Write-Host "  $java"
          Write-Host "  $agent"
          Write-Host "  $launcher"
          Write-Host "  $debugLauncher"
          Write-Host '  i18n/messages.properties'
          Write-Host '  i18n/messages_ru.properties'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: failchat-windows-x64
          path: target/failchat-v*.zip
          if-no-files-found: error
          retention-days: 14
